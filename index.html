<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRACTICES - VILLARREAL SEBERIAN RICARDO</title>
    <!-- Importación de fuente estilo anime/cyber-gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Orbitron:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cinzel', 'Segoe UI', serif;
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(138, 3, 3, 0.15) 0%, transparent 70%),
                linear-gradient(rgba(18, 18, 18, 0.85), rgba(8, 8, 8, 0.95));
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Textura de rejilla / ambiente siniestro */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 1;
        }

        /* Barra de navegación superior */
        header {
            background: linear-gradient(180deg, #121212 0%, #0a0a0a 100%);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8a0303;
            box-shadow: 0 4px 20px rgba(138, 3, 3, 0.4), inset 0 -1px 10px rgba(255, 0, 0, 0.2);
            position: relative;
            z-index: 20;
        }

        .header-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #ff1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(138, 3, 3, 0.6);
        }

        .header-title h2 {
            font-size: 0.85rem;
            color: #a0a0a0;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .btn-back {
            background: #111;
            color: #e0e0e0;
            border: 1px solid #8a0303;
            padding: 10px 20px;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: inset 0 0 5px rgba(255, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-back::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.4), transparent);
            transition: 0.5s;
        }

        .btn-back:hover::before {
            left: 100%;
        }

        .btn-back:hover {
            background-color: #8a0303;
            color: #ffffff;
            border-color: #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            transform: scale(1.05);
        }

        /* Área principal de contenido */
        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        /* Pantalla de Menú Principal */
        .menu-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 25px;
            background: radial-gradient(circle at center, rgba(20, 5, 5, 0.9) 0%, rgba(5, 5, 5, 0.98) 100%);
            z-index: 10;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(5px);
        }

        .menu-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 20px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 3px solid #8a0303;
            padding-bottom: 12px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
            position: relative;
        }

        .menu-title::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 30%;
            width: 40%;
            height: 3px;
            background: #ff1a1a;
            box-shadow: 0 0 10px #ff1a1a;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #141414 0%, #0a0a0a 100%);
            color: #d0d0d0;
            border: 1px solid #333333;
            border-left: 4px solid #8a0303;
            padding: 16px 24px;
            border-radius: 0px;
            text-decoration: none;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
            position: relative;
            clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
        }

        .menu-btn:hover {
            background: linear-gradient(135deg, #2a0404 0%, #120202 100%);
            color: #ffffff;
            border-color: #ff1a1a;
            border-left: 4px solid #ff1a1a;
            transform: translateX(6px) translateY(-2px);
            box-shadow: -5px 5px 20px rgba(255, 0, 0, 0.4), 0 0 10px rgba(138, 3, 3, 0.6);
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        /* Visor Frame */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #080808;
        }

        /* Utilidad para ocultar elementos */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Encabezado con tu nombre y botón de regreso -->
    <header>
        <div class="header-title">
            <h1>VILLARREAL SEBERIAN RICARDO</h1>
            <h2>PRACTICAS DIAGRAMAS</h2>
        </div>
        <button class="btn-back" onclick="showMenu()">← Volver al Menú</button>
    </header>

    <main>
        <!-- Pantalla Principal: Menú de Selección -->
        <div id="main-menu" class="menu-container">
            <h2 class="menu-title">Selecciona un Diagrama</h2>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="openDiagram('villarreal_agencia_ia.html')">1. Agencia IA</button>
                <button class="menu-btn" onclick="openDiagram('villarreal_seberian_dconseguir_clientes.html')">2. Conseguir Clientes</button>
                <button class="menu-btn" onclick="openDiagram('villarreal_seberian_ganar_dinero.html')">3. Ganar Dinero</button>
            </div>
        </div>

        <!-- Contenedor iframe sin diagrama cargado inicialmente -->
        <iframe id="diagram-frame" class="hidden" src="about:blank"></iframe>
    </main>

    <script>
        const menu = document.getElementById('main-menu');
        const frame = document.getElementById('diagram-frame');

        // Función para abrir el diagrama seleccionado
        function openDiagram(url) {
            frame.src = url;
            menu.classList.add('hidden');
            frame.classList.remove('hidden');
        }

        // Función para regresar al menú principal
        function showMenu() {
            frame.src = 'about:blank'; // Limpia el visor
            frame.classList.add('hidden');
            menu.classList.remove('hidden');
        }
    </script>

</body>
</html>
